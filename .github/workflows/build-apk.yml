name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web assets directory
        run: |
          mkdir -p dist
          cp index.html manifest.json dist/ 2>/dev/null || true
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi

      - name: Build APK with Capacitor and Gradle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

          # 1. Solución robusta para evitar conflictos de versiones duplicadas de Kotlin
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }" >> android/app/build.gradle

          # 2. Inyectar automáticamente los permisos en el AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' "$MANIFEST_PATH"
          fi

          # 3. Sustituir automáticamente los iconos genéricos por tu icono exterior de assets
          if [ -f "assets/icon.png" ]; then
            echo "Copiando icono personalizado desde assets/icon.png..."
            RES_DIR="android/app/src/main/res"
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$d"
              cp "assets/icon.png" "$RES_DIR/$d/ic_launcher.png" 2>/dev/null || true
              cp "assets/icon.png" "$RES_DIR/$d/ic_launcher_round.png" 2>/dev/null || true
            done
          fi

          # 4. Modificar MainActivity y crear Plugin de Botón Flotante Arrastrable
          MAIN_ACTIVITY="android/app/src/main/java/com/novanote/app/MainActivity.java"
          PLUGIN_FILE="android/app/src/main/java/com/novanote/app/FloatingButtonPlugin.java"
          
          if [ -f "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.novanote.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.Manifest;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  registerPlugin(FloatingButtonPlugin.class);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }
              }
          }
          EOF
          fi
          
          cat << 'EOF' > "$PLUGIN_FILE"
          package com.novanote.app;

          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "FloatingButtonPlugin")
          public class FloatingButtonPlugin extends Plugin {
              private WindowManager windowManager;
              private Button floatingButton;

              @PluginMethod
              public void showOverlay(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      if (floatingButton != null) {
                          call.resolve();
                          return;
                      }

                      windowManager = (WindowManager) getContext().getSystemService(Context.WINDOW_SERVICE);
                      floatingButton = new Button(getContext());
                      floatingButton.setText("+");
                      floatingButton.setBackgroundColor(Color.parseColor("#22d3ee"));
                      floatingButton.setTextColor(Color.parseColor("#030712"));

                      int layoutFlag;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          layoutFlag = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                      } else {
                          layoutFlag = WindowManager.LayoutParams.TYPE_PHONE;
                      }

                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              120,
                              120,
                              layoutFlag,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                              PixelFormat.TRANSLUCENT
                      );

                      params.gravity = Gravity.TOP | Gravity.LEFT;
                      params.x = 0;
                      params.y = 100;

                      floatingButton.setOnTouchListener(new View.OnTouchListener() {
                          private int initialX;
                          private int initialY;
                          private float initialTouchX;
                          private float initialTouchY;

                          @SuppressLint("ClickableViewAccessibility")
                          @Override
                          public boolean onTouch(View v, MotionEvent event) {
                              switch (event.getAction()) {
                                  case MotionEvent.ACTION_DOWN:
                                      initialX = params.x;
                                      initialY = params.y;
                                      initialTouchX = event.getRawX();
                                      initialTouchY = event.getRawY();
                                      return true;
                                  case MotionEvent.ACTION_MOVE:
                                      params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                      params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                      windowManager.updateViewLayout(floatingButton, params);
                                      return true;
                                  case MotionEvent.ACTION_UP:
                                      int diffX = (int) (event.getRawX() - initialTouchX);
                                      int diffY = (int) (event.getRawY() - initialTouchY);
                                      if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
                                          Intent intent = new Intent(getContext(), MainActivity.class);
                                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                                          getContext().startActivity(intent);
                                      }
                                      return true;
                              }
                              return false;
                          }
                      });

                      windowManager.addView(floatingButton, params);
                      call.resolve();
                  });
              }

              @PluginMethod
              public void hideOverlay(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      if (floatingButton != null && windowManager != null) {
                          windowManager.removeView(floatingButton);
                          floatingButton = null;
                      }
                      call.resolve();
                  });
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk