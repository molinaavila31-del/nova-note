name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Recreate Environment and Build APK
        run: |
          # Si no existe el package.json, lo inicializamos automáticamente
          if [ ! -f package.json ]; then
            npm init -y
          fi
          
          # Instalamos las dependencias y Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Configuramos el proyecto móvil apuntando a la raíz donde está tu index.html
          npx cap init NovaNote com.novanote.app --web-dir . --yes || true
          
          # Añadimos la plataforma Android y sincronizamos los archivos
          npx cap add android
          npx cap sync android

          # Compilamos el APK usando Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk