name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web assets directory
        run: |
          mkdir -p dist
          cp index.html manifest.json dist/ 2>/dev/null || true
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi

      - name: Build APK with Capacitor and Gradle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

          # 1. Solución para evitar el conflicto de clases duplicadas de Kotlin
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              }
          }" >> android/app/build.gradle

          # 2. Inyectar automáticamente los permisos en el AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' "$MANIFEST_PATH"
          fi

          # 3. Sustituir automáticamente los iconos genéricos por tu icono exterior de assets
          ICON_SOURCE=""
          if [ -f "assets/nombre_de_tu_icono_exterior.png" ]; then
            ICON_SOURCE="assets/nombre_de_tu_icono_exterior.png"
          elif [ -f "assets/nombre_de_tu_icono_exterior.png" ]; then
            ICON_SOURCE="assets/nombre_de_tu_icono_exterior.png"
          elif [ -f "assets/nombre_de_tu_icono_exterior.png" ]; then
            ICON_SOURCE="assets/nombre_de_tu_icono_exterior.png"
          fi

          if [ -n "$ICON_SOURCE" ]; then
            echo "Copiando icono personalizado desde $ICON_SOURCE..."
            RES_DIR="android/app/src/main/res"
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$d"
              cp "$ICON_SOURCE" "$RES_DIR/$d/ic_launcher.png" 2>/dev/null || cp "$ICON_SOURCE" "$RES_DIR/$d/ic_launcher.jpg" 2>/dev/null || true
              cp "$ICON_SOURCE" "$RES_DIR/$d/ic_launcher_round.png" 2>/dev/null || cp "$ICON_SOURCE" "$RES_DIR/$d/ic_launcher_round.jpg" 2>/dev/null || true
            done
          fi

          # 4. Modificar MainActivity.java para solicitar permisos en tiempo de ejecución
          MAIN_ACTIVITY="android/app/src/main/java/com/novanote/app/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.novanote.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.Manifest;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Solicitar permiso de superposición flotante (Aparecer encima)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  }

                  // Solicitar permisos de notificaciones para el calendario en Android 13+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }
              }
          }
          EOF
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk