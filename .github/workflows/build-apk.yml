name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
            uses: actions/setup-java@v5
            with:
              distribution: 'temurin'
              java-version: '21'

      - name: Prepare web assets directory
        run: |
          mkdir -p dist
          # Copiamos el index.html, manifest e iconos dentro de la carpeta dist que exige Capacitor
          cp index.html manifest.json dist/ 2>/dev/null || true
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi

      - name: Build APK with Capacitor and Gradle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk