<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Note - Cyberpunk HUD</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/nombre de tu icono exterior.jpg">
    <style>
        :root {
            --bg-base: #030712;
            --surface-card: #0b1329;
            --surface-glass: rgba(11, 19, 41, 0.85);
            --neon-cyan: #22d3ee;
            --neon-green: #34d399;
            --neon-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-cyber: rgba(34, 211, 238, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Contenedor principal de la app */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            gap: 16px;
            padding-bottom: 90px;
        }

        /* Cabecera HUD */
        .hud-header {
            background: var(--surface-card);
            border: 1px solid var(--border-cyber);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-brand img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--neon-cyan);
        }

        .hud-brand span {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .hud-badge {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Barra de búsqueda */
        .search-box {
            background: var(--surface-card);
            border: 1px solid var(--border-cyber);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* Filtros por carpetas y etiquetas */
        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: var(--surface-card);
            border: 1px solid var(--border-cyber);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.active {
            background: var(--neon-cyan);
            color: #030712;
            border-color: var(--neon-cyan);
            font-weight: bold;
        }

        /* Listado de Tarjetas */
        .notes-feed {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .note-card {
            background: var(--surface-card);
            border: 1px solid var(--border-cyber);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .note-meta-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tag-type {
            background: rgba(34, 211, 238, 0.1);
            color: var(--neon-cyan);
            border: 1px solid rgba(34, 211, 238, 0.3);
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tag-folder {
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .note-card h3 {
            font-size: 16px;
            color: var(--text-main);
            font-weight: 600;
        }

        .note-card p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* Bloque de código simulado */
        .code-snippet {
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: var(--neon-cyan);
            overflow-x: auto;
        }

        .note-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .delete-note-btn {
            background: none;
            border: none;
            color: #f43f5e;
            cursor: pointer;
            font-size: 16px;
        }

        /* Barra de pestañas inferior (Navegación) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--surface-card);
            border-top: 1px solid var(--border-cyber);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-cyan);
        }

        .nav-item span.icon {
            font-size: 18px;
        }

        /* Botón flotante principal (+) */
        .fab-btn {
            position: fixed;
            bottom: 75px;
            right: 20px;
            background: var(--neon-cyan);
            color: #030712;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            border: none;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            cursor: pointer;
            z-index: 101;
            transition: transform 0.2s;
        }

        .fab-btn:active {
            transform: scale(0.9);
        }

        /* Pestaña lateral verde de acceso rápido en el borde derecho */
        .quick-edge-tab {
            position: fixed;
            right: 0;
            top: 45%;
            width: 8px;
            height: 60px;
            background: var(--neon-green);
            border-radius: 4px 0 0 4px;
            box-shadow: 0 0 10px var(--neon-green);
            cursor: pointer;
            z-index: 105;
        }

        /* Panel Deslizable de Captura Exprés (Modal inferior) */
        .quick-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .quick-sheet-overlay.open {
            display: flex;
        }

        .quick-sheet {
            background: #0b1329;
            border: 1px solid var(--neon-cyan);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 90vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-indicator {
            width: 40px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 2px;
            align-self: center;
            margin-bottom: 4px;
        }

        .sheet-title-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--neon-cyan);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .type-selector {
            display: flex;
            gap: 8px;
        }

        .type-btn {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid var(--border-cyber);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .type-btn.active {
            background: rgba(34, 211, 238, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .quick-sheet input, .quick-sheet textarea {
            background: var(--bg-base);
            border: 1px solid var(--border-cyber);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        .quick-sheet textarea {
            height: 100px;
            resize: none;
        }

        .folder-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .folder-pill {
            background: var(--bg-base);
            border: 1px solid var(--border-cyber);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .folder-pill.active {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(34, 211, 238, 0.05);
        }

        .save-cyber-btn {
            background: var(--neon-cyan);
            color: #030712;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Pestaña lateral derecha de acceso rápido (Barra verde interactiva) -->
    <div class="quick-edge-tab" onclick="toggleQuickSheet(true)" title="Acceso Rápido"></div>

    <!-- Contenedor Principal de la App -->
    <div class="app-container">
        
        <!-- Cabecera HUD -->
        <div class="hud-header">
            <div class="hud-brand">
                <img src="assets/nombre_de_tu_icono_interior.jpg" alt="Logo">
                <span>Nova Notes</span>
            </div>
            <div class="hud-badge">● 2 AVISOS</div>
        </div>

        <!-- Buscador -->
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="Buscar notas, listas, código..." oninput="filterNotes()">
        </div>

        <!-- Filtros horizontales de carpetas -->
        <div class="filter-scroll">
            <div class="chip active" onclick="setFolderFilter('Todas', event)">Todas</div>
            <div class="chip" onclick="setFolderFilter('Raíz', event)">Raíz</div>
            <div class="chip" onclick="setFolderFilter('Cyber Ops', event)">Cyber Ops</div>
            <div class="chip" onclick="setFolderFilter('Code Matrix', event)">Code Matrix</div>
        </div>

        <!-- Subfiltros por tipo -->
        <div class="filter-scroll">
            <div class="chip active" onclick="setTypeFilter('TODOS', event)">TODOS</div>
            <div class="chip" onclick="setTypeFilter('TEXTO', event)">TEXTO</div>
            <div class="chip" onclick="setTypeFilter('CHECKLIST', event)">CHECKLIST</div>
            <div class="chip" onclick="setTypeFilter('CÓDIGO', event)">CÓDIGO</div>
        </div>

        <!-- Listado de Notas -->
        <div class="notes-feed" id="notes-feed">
            <!-- Se inyectan dinámicamente -->
        </div>

    </div>

    <!-- Botón flotante de acción rápida (+) -->
    <button class="fab-btn" onclick="toggleQuickSheet(true)">+</button>

    <!-- Barra de Navegación Inferior -->
    <nav class="bottom-nav">
        <button class="nav-item active">
            <span class="icon">≡</span>
            <span>NOTAS</span>
        </button>
        <button class="nav-item" onclick="alert('Módulo de Calendario y Tiempos')">
            <span class="icon">📅</span>
            <span>CALENDARIO</span>
        </button>
        <button class="nav-item" onclick="alert('Gestor de Carpetas Avanzado')">
            <span class="icon">📁</span>
            <span>CARPETAS</span>
        </button>
    </nav>

    <!-- Modal / Panel Deslizable de Captura Exprés -->
    <div class="quick-sheet-overlay" id="sheet-overlay" onclick="handleOverlayClick(event)">
        <div class="quick-sheet">
            <div class="sheet-indicator"></div>
            <div class="sheet-title-bar">
                <span style="color: var(--neon-green);">●</span> NOVA NOTE • CAPTURA EXPRÉS
            </div>

            <!-- Selector de Tipo -->
            <div class="type-selector">
                <div class="type-btn active" onclick="selectType('TEXTO', event)">Texto</div>
                <div class="type-btn" onclick="selectType('CHECKLIST', event)">Checklist</div>
                <div class="type-btn" onclick="selectType('CÓDIGO', event)">Código</div>
            </div>

            <input type="text" id="quick-title" placeholder="Título de la idea...">
            <textarea id="quick-content" placeholder="Apunta tu idea al vuelo..."></textarea>

            <!-- Selector de Carpeta -->
            <div class="folder-pills" id="sheet-folders">
                <div class="folder-pill active" onclick="selectSheetFolder('Raíz', event)">📁 Raíz</div>
                <div class="folder-pill" onclick="selectSheetFolder('Cyber Ops', event)">📁 Cyber Ops</div>
                <div class="folder-pill" onclick="selectSheetFolder('Code Matrix', event)">📁 Code Matrix</div>
            </div>

            <button class="save-cyber-btn" onclick="saveQuickNote()">➜ GUARDAR EN NOVA NOTE</button>
        </div>
    </div>

    <script>
        let currentFolderFilter = 'Todas';
        let currentTypeFilter = 'TODOS';
        let selectedSheetType = 'TEXTO';
        let selectedSheetFolder = 'Raíz';

        // Datos iniciales por defecto si está vacío
        const defaultNotes = [
            {
                id: 1,
                title: "Bienvenido a Nova Note",
                content: "Nova Note es tu centro de comando cyberpunk para apuntes ultrarrápidos y gestión del tiempo.",
                type: "TEXTO",
                folder: "Cyber Ops",
                date: "31/10/2026"
            },
            {
                id: 2,
                title: "Snippet: Express Capture Algorithm",
                content: "// Nova Note Realtime Capture\nfun triggerCosoAlert(hasUnread: Boolean): Color { return if (hasUnread) ... }",
                type: "CÓDIGO",
                folder: "Code Matrix",
                date: "31/10/2026"
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('nova_cyber_notes')) {
                localStorage.setItem('nova_cyber_notes', JSON.stringify(defaultNotes));
            }
            renderNotes();
        });

        function toggleQuickSheet(open) {
            const overlay = document.getElementById('sheet-overlay');
            if (open) {
                overlay.classList.add('open');
            } else {
                overlay.classList.remove('open');
            }
        }

        function handleOverlayClick(event) {
            if (event.target.id === 'sheet-overlay') {
                toggleQuickSheet(false);
            }
        }

        function selectType(type, event) {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            selectedSheetType = type;
        }

        function selectSheetFolder(folder, event) {
            document.querySelectorAll('.folder-pill').forEach(p => p.classList.remove('active'));
            event.currentTarget.classList.add('active');
            selectedSheetFolder = folder;
        }

        function setFolderFilter(folder, event) {
            document.querySelectorAll('.filter-scroll .chip').forEach(c => {
                if(c.textContent === 'Todas' || c.textContent === 'Raíz' || c.textContent === 'Cyber Ops' || c.textContent === 'Code Matrix') {
                    c.classList.remove('active');
                }
            });
            event.currentTarget.classList.add('active');
            currentFolderFilter = folder;
            renderNotes();
        }

        function setTypeFilter(type, event) {
            document.querySelectorAll('.filter-scroll .chip').forEach(c => {
                if(c.textContent === 'TODOS' || c.textContent === 'TEXTO' || c.textContent === 'CHECKLIST' || c.textContent === 'CÓDIGO') {
                    c.classList.remove('active');
                }
            });
            event.currentTarget.classList.add('active');
            currentTypeFilter = type;
            renderNotes();
        }

        function saveQuickNote() {
            const titleInput = document.getElementById('quick-title');
            const contentInput = document.getElementById('quick-content');
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title && !content) return;

            const notes = JSON.parse(localStorage.getItem('nova_cyber_notes') || '[]');
            const newNote = {
                id: Date.now(),
                title: title || 'Nodo sin título',
                content: content,
                type: selectedSheetType,
                folder: selectedSheetFolder,
                date: new Date().toLocaleDateString()
            };

            notes.unshift(newNote);
            localStorage.setItem('nova_cyber_notes', JSON.stringify(notes));

            titleInput.value = '';
            contentInput.value = '';
            toggleQuickSheet(false);
            renderNotes();
        }

        function renderNotes() {
            const feed = document.getElementById('notes-feed');
            const search = document.getElementById('search-input').value.toLowerCase();
            const notes = JSON.parse(localStorage.getItem('nova_cyber_notes') || '[]');

            const filtered = notes.filter(note => {
                const matchesFolder = currentFolderFilter === 'Todas' || note.folder === currentFolderFilter;
                const matchesType = currentTypeFilter === 'TODOS' || note.type === currentTypeFilter;
                const matchesSearch = note.title.toLowerCase().includes(search) || note.content.toLowerCase().includes(search);
                return matchesFolder && matchesType && matchesSearch;
            });

            if (filtered.length === 0) {
                feed.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 20px;">Sin registros en el sistema.</p>';
                return;
            }

            feed.innerHTML = filtered.map(note => {
                let contentBlock = `<p>${escapeHtml(note.content)}</p>`;
                if (note.type === 'CÓDIGO') {
                    contentBlock = `<div class="code-snippet">${escapeHtml(note.content)}</div>`;
                }

                return `
                    <div class="note-card">
                        <div class="note-meta-row">
                            <span class="tag-type">${note.type}</span>
                            <span class="tag-folder">${note.folder}</span>
                        </div>
                        <h3>${escapeHtml(note.title)}</h3>
                        ${contentBlock}
                        <div class="note-footer-row">
                            <span>${note.date}</span>
                            <button class="delete-note-btn" onclick="deleteNote(${note.id})">×</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterNotes() {
            renderNotes();
        }

        function deleteNote(id) {
            let notes = JSON.parse(localStorage.getItem('nova_cyber_notes') || '[]');
            notes = notes.notes.filter ? notes.filter(n => n.id !== id) : [];
            localStorage.setItem('nova_cyber_notes', JSON.stringify(notes));
            renderNotes();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
