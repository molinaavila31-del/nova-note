<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Note - Quantum UI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/nombre de tu icono exterior.jpg">
    <style>
        :root {
            --bg-deep: #030712;
            --surface-glass: rgba(15, 23, 42, 0.75);
            --surface-folder: rgba(30, 41, 59, 0.5);
            --neon-blue: #38bdf8;
            --neon-purple: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(56, 189, 248, 0.3);
            --danger: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera futurista estilo HUD */
        header {
            padding: 18px 20px;
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--text-main), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Lienzo principal de carpetas y notas en cascada */
        .canvas-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Panel de entrada rápida estilo holográfico */
        .quick-input-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input, textarea, select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        textarea {
            resize: none;
            height: 70px;
        }

        .cyber-btn {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #030712;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cyber-btn:active {
            transform: scale(0.98);
        }

        /* Contenedor de Carpetas */
        .folders-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .folder-section {
            background: var(--surface-folder);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(5px);
        }

        .folder-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
            color: var(--neon-blue);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .folder-header span.icon {
            font-size: 18px;
        }

        /* Tarjetas de notas dentro de las carpetas */
        .notes-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .note-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            transition: border-color 0.2s;
        }

        .note-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .note-card h3 {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 500;
            padding-right: 24px;
        }

        .note-card p {
            font-size: 13px;
            color: var(--text-muted);
            word-break: break-word;
            line-height: 1.4;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .note-date {
            font-size: 10px;
            color: rgba(148, 163, 184, 0.6);
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .empty-folder {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 8px;
        }
    </style>
</head>
<body>

    <!-- Cabecera estilo HUD Futurista -->
    <header>
        <div class="brand-container">
            <!-- Icono interior configurado correctamente -->
            <img src="assets/nombre_de_tu_icono_interior.jpg" alt="Nova Note Core" class="brand-icon">
            <h1>NOVA NOTE // QUANTUM</h1>
        </div>
    </header>

    <!-- Lienzo principal de trabajo -->
    <div class="canvas-container">
        
        <!-- Panel de Creación Rápida unificado -->
        <div class="quick-input-panel">
            <div class="input-row">
                <input type="text" id="note-title" placeholder="Título de la nota...">
                <select id="note-folder">
                    <option value="Proyectos Quantum">📁 Proyectos Quantum</option>
                    <option value="Ideas y Registros">📁 Ideas y Registros</option>
                </select>
            </div>
            <textarea id="note-content" placeholder="Escribe los detalles del registro..."></textarea>
            <button class="cyber-btn" onclick="saveNote()">Registrar en Sistema</button>
        </div>

        <!-- Contenedor general de carpetas estilo archivador futurista -->
        <div class="folders-wrapper" id="folders-wrapper">
            <!-- Las carpetas y notas se renderizan dinámicamente aquí -->
        </div>

    </div>

    <script>
        // Sistema de gestión de notas categorizadas por carpetas (100% Offline con localStorage)
        document.addEventListener('DOMContentLoaded', renderCanvas);

        function saveNote() {
            const titleInput = document.getElementById('note-title');
            const contentInput = document.getElementById('note-content');
            const folderSelect = document.getElementById('note-folder');
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const folder = folderSelect.value;

            if (!title && !content) return;

            const notes = JSON.parse(localStorage.getItem('nova_quantum_notes') || '[]');
            const newNote = {
                id: Date.now(),
                title: title || 'Nodo sin título',
                content: content,
                folder: folder,
                date: new Date().toLocaleDateString()
            };

            notes.unshift(newNote);
            localStorage.setItem('nova_quantum_notes', JSON.stringify(notes));

            titleInput.value = '';
            contentInput.value = '';
            renderCanvas();
        }

        function renderCanvas() {
            const wrapper = document.getElementById('folders-wrapper');
            const notes = JSON.parse(localStorage.getItem('nova_quantum_notes') || '[]');
            
            // Definimos las carpetas disponibles en el sistema
            const folders = ['Proyectos Quantum', 'Ideas y Registros'];
            
            wrapper.innerHTML = '';

            folders.forEach(folderName => {
                const folderNotes = notes.filter(n => n.folder === folderName);
                
                const section = document.createElement('div');
                section.className = 'folder-section';
                
                let notesHtml = '';
                if (folderNotes.length === 0) {
                    notesHtml = `<div class="empty-folder">Carpeta vacía - Sin registros activos.</div>`;
                } else {
                    notesHtml = folderNotes.map(note => `
                        <div class="note-card">
                            <h3>${escapeHtml(note.title)}</h3>
                            <p>${escapeHtml(note.content)}</p>
                            <div class="note-footer">
                                <span class="note-date">${note.date}</span>
                            </div>
                            <button class="delete-btn" onclick="deleteNote(${note.id})">×</button>
                        </div>
                    `).join('');
                }

                section.innerHTML = `
                    <div class="folder-header">
                        <span class="icon">📂</span>
                        <span>${folderName} (${folderNotes.length})</span>
                    </div>
                    <div class="notes-grid">
                        ${notesHtml}
                    </div>
                `;

                wrapper.appendChild(section);
            });
        }

        function deleteNote(id) {
            let notes = JSON.parse(localStorage.getItem('nova_quantum_notes') || '[]');
            notes = notes.filter(note => note.id !== id);
            localStorage.setItem('nova_quantum_notes', JSON.stringify(notes));
            renderCanvas();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
