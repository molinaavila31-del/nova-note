<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Note</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.png">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --accent-color: #60a5fa;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra lateral flotante / Navegación */
        .sidebar {
            width: 70px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
        }

        .logo-container img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Contenido principal */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        header {
            padding: 20px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 20px;
            color: var(--text-color);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Secciones */
        .section {
            display: none;
            flex-direction: column;
            height: 100%;
            gap: 15px;
        }

        .section.active {
            display: flex;
        }

        /* Notas */
        .note-input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--surface-color);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        input, textarea, select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button.primary-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.primary-btn:hover {
            background-color: var(--accent-color);
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .note-card {
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }

        .note-card h3 {
            font-size: 16px;
            color: var(--accent-color);
        }

        .note-card p {
            font-size: 14px;
            color: var(--text-secondary);
            word-break: break-word;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
        }

        /* Estilo Calendario básico */
        .calendar-view {
            background: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Barra lateral de navegación -->
    <nav class="sidebar">
        <div class="logo-container">
            <img src="assets/icon.png" alt="Nova Note Logo">
        </div>
        <button class="nav-btn active" onclick="switchSection('notes', event)" title="Notas">📝</button>
        <button class="nav-btn" onclick="switchSection('calendar', event)" title="Calendario">📅</button>
    </nav>

    <!-- Contenedor principal -->
    <div class="main-container">
        <header>
            <h1 id="header-title">Nova Note - Notas</h1>
        </header>

        <div class="content-area">
            
            <!-- Sección Notas -->
            <div id="notes-section" class="section active">
                <div class="note-input-container">
                    <input type="text" id="note-title" placeholder="Título de la nota...">
                    <textarea id="note-content" placeholder="Escribe tu nota aquí..."></textarea>
                    <button class="primary-btn" onclick="saveNote()">Guardar Nota</button>
                </div>
                <div class="notes-list" id="notes-list">
                    <!-- Las notas se cargan dinámicamente aquí -->
                </div>
            </div>

            <!-- Sección Calendario -->
            <div id="calendar-section" class="section">
                <div class="calendar-view">
                    <h2>Calendario y Tareas</h2>
                    <p style="margin-top: 15px; color: var(--text-secondary);">Organiza tus pendientes y sincroniza tus jornadas sin conexión.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Funcionalidad de navegación entre secciones
        function switchSection(sectionName, event) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            if (sectionName === 'notes') {
                document.getElementById('notes-section').classList.add('active');
                document.getElementById('header-title').innerText = 'Nova Note - Notas';
            } else if (sectionName === 'calendar') {
                document.getElementById('calendar-section').classList.add('active');
                document.getElementById('header-title').innerText = 'Nova Note - Calendario';
            }

            event.currentTarget.classList.add('active');
        }

        // Sistema de Notas con localStorage (100% offline)
        document.addEventListener('DOMContentLoaded', loadNotes);

        function saveNote() {
            const titleInput = document.getElementById('note-title');
            const contentInput = document.getElementById('note-content');
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title && !content) return;

            const notes = JSON.parse(localStorage.getItem('nova_notes') || '[]');
            const newNote = {
                id: Date.now(),
                title: title || 'Sin título',
                content: content,
                date: new Date().toLocaleDateString()
            };

            notes.unshift(newNote);
            localStorage.setItem('nova_notes', JSON.stringify(notes));

            titleInput.value = '';
            contentInput.value = '';
            loadNotes();
        }

        function loadNotes() {
            const listContainer = document.getElementById('notes-list');
            const notes = JSON.parse(localStorage.getItem('nova_notes') || '[]');
            
            listContainer.innerHTML = '';

            if (notes.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-secondary); text-align: center; margin-top: 20px;">No hay notas guardadas aún.</p>';
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <h3>${escapeHtml(note.title)}</h3>
                    <p>${escapeHtml(note.content)}</p>
                    <small style="color: var(--text-secondary); font-size: 11px; margin-top: 5px;">${note.date}</small>
                    <button class="delete-btn" onclick="deleteNote(${note.id})">×</button>
                `;
                listContainer.appendChild(card);
            });
        }

        function deleteNote(id) {
            let notes = JSON.parse(localStorage.getItem('nova_notes') || '[]');
            notes = notes.filter(note => note.id !== id);
            localStorage.setItem('nova_notes', JSON.stringify(notes));
            loadNotes();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
